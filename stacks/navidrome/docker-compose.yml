services:
  navidrome:
    image: deluan/navidrome:latest
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_ENABLECOVERANIMATION: "true"
    volumes:
      # Biblioteca de música montada só para leitura (:ro): o Navidrome não consegue alterar os arquivos.
      - "${MUSIC_DIR:-/home/leonardo/meu_drive/Musicas}:/music:ro"
